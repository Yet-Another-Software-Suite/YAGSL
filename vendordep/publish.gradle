apply plugin: 'maven-publish'

ext.licenseFile = files("$rootDir/LICENSE.txt")

ext.outputsFolder = file("$buildDir/outputs")

def versionFile = file("$outputsFolder/version.txt")
def releasesRepoUrl = "$releasePath/releases"

task outputVersions() {
    description = 'Prints the versions of wpilib to a file for use by the downstream packaging project'
    group = 'Build'
    outputs.files(versionFile)

    doFirst {
        buildDir.mkdir()
        outputsFolder.mkdir()
    }

    doLast {
        versionFile.write pubVersion
    }
}

task libraryBuild() {}

build.dependsOn outputVersions

task copyAllOutputs(type: Copy) {
    destinationDir = file("$buildDir/allOutputs")
    from versionFile
    dependsOn outputVersions
}

build.dependsOn copyAllOutputs
copyAllOutputs.dependsOn outputVersions

ext.addTaskToCopyAllOutputs = { task ->
    copyAllOutputs.dependsOn task
    copyAllOutputs.inputs.file task.archiveFile
    copyAllOutputs.from task.archiveFile
}

ext.artifactGroupId = 'swervelib'
ext.baseArtifactId = 'YAGSL'

// -----------------------------------------------------------------------------------------------
// Java artifacts: "core" (swervelib.core, no command-framework dependency) plus one jar per supported WPILib
// command version ("commands2", "commands3"). "core" is everything outside of swervelib/commands2
// and swervelib/commands3; each command variant is only its own swervelib/<name> package. Each gets
// the same five jar tasks: a short-classifier jar + sources-jar for the Maven publication below, and
// a vendordep-output-named jar/sources-jar/javadoc-jar for copyAllOutputs. Add a name here (and a
// matching entry in vendordepJson.gradle's vendordepVariants) to publish a new variant.
// -----------------------------------------------------------------------------------------------
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

def commandVariantNames = ['commands2', 'commands3']
def javaArtifactNames = ['core'] + commandVariantNames
def javaArtifacts = [:]

javaArtifactNames.each { name ->
    def filterPackages = { spec ->
        if (name == 'core') {
            commandVariantNames.each { variant -> spec.exclude "swervelib/${variant}/**" }
        } else {
            spec.include "swervelib/${name}/**"
        }
    }
    def outputBaseName = "_GROUP_swervelib_ID_${baseArtifactId}-${name}_CLS"
    def titleCaseName = name.capitalize()

    // The Maven publication uses each jar's classifier as-is, so these must be unclassified and
    // "sources" for the published files to be <artifactId>-<version>.jar and
    // <artifactId>-<version>-sources.jar, which is what the vendordep JSON's javaDependencies resolve
    // to. The per-variant base name keeps the variants from overwriting each other in build/libs.
    def jar = tasks.create("${name}Jar", Jar) {
        dependsOn classes
        archiveBaseName = "${baseArtifactId}-${name}"
        from(sourceSets.main.output, filterPackages)
    }
    def sourcesJar = tasks.create("${name}SourcesJar", Jar) {
        dependsOn classes
        archiveBaseName = "${baseArtifactId}-${name}"
        archiveClassifier = 'sources'
        from(sourceSets.main.allSource, filterPackages)
    }
    def outputJar = tasks.create("output${titleCaseName}Jar", Jar) {
        dependsOn classes
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        from(sourceSets.main.output, filterPackages)
    }
    def outputSourcesJar = tasks.create("output${titleCaseName}SourcesJar", Jar) {
        dependsOn classes
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'sources'
        from(sourceSets.main.allSource, filterPackages)
    }
    def outputJavadocJar = tasks.create("output${titleCaseName}JavadocJar", Jar) {
        dependsOn javadoc
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    javaArtifacts[name] = [
        jar: jar, sourcesJar: sourcesJar,
        outputJar: outputJar, outputSourcesJar: outputSourcesJar, outputJavadocJar: outputJavadocJar,
    ]

    addTaskToCopyAllOutputs(outputSourcesJar)
    addTaskToCopyAllOutputs(outputJavadocJar)
    addTaskToCopyAllOutputs(outputJar)
    build.dependsOn outputSourcesJar
    build.dependsOn outputJavadocJar
    build.dependsOn outputJar
}

// Builds yagsl_commands2.json/yagsl_commands3.json from yagsl.json and wires up their zip tasks
// (commands2VendordepJsonZip/commands3VendordepJsonZip) and build/copyAllOutputs dependencies.
apply from: 'vendordepJson.gradle'

artifacts {
    tasks.named("assemble") {
        javaArtifacts.each { name, t ->
            archives t.jar
            archives t.sourcesJar
            archives t.outputJar
            archives t.outputSourcesJar
            archives t.outputJavadocJar
        }
        archives javadocJar
    }
}

libraryBuild.dependsOn build

publishing {
    repositories {
        maven {
            url = releasesRepoUrl
        }
    }
    publications {
        javaArtifactNames.each { name ->
            def t = javaArtifacts[name]
            "$name"(MavenPublication) {
                artifact t.jar
                artifact t.sourcesJar
                artifact javadocJar

                artifactId = "${baseArtifactId}-${name}"
                groupId = artifactGroupId
                version = pubVersion
            }

            // Only non-core variants ship their own vendordep JSON.
            if (name != 'core') {
                "${name}Vendordep"(MavenPublication) {
                    artifact tasks.named("${name}VendordepJsonZip").get()

                    artifactId = "${baseArtifactId}-${name}-vendordep"
                    groupId = artifactGroupId
                    version = pubVersion
                }
            }
        }
    }
}
